<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubic Лаунчер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Задний фон: умиротворяющий лесной градиент */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 25, 15, 0.5), rgba(5, 15, 10, 0.7)), 
                        url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.8);
        }

        /* Эффект легкого тумана/анимации */
        .fog {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: fogMove 20s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes fogMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Главный контейнер */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        /* Карточка лаунчера */
        .launcher-card {
            background: rgba(15, 30, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #d4edda;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #c8d6cb;
            line-height: 1.5;
        }

        /* Кнопка скачивания */
        .download-btn {
            display: inline-block;
            background: #2d6a4f;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.4);
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #40916c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(64, 145, 108, 0.6);
        }

        /* Плеер / Кнопка управления музыкой */
        .music-control {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .music-control:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <div class="fog"></div>

    <!-- Фоновая музыка (спокойная мелодия) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="launcher-card">
            <h1>Лесной Лаунчер</h1>
            <p>Добро пожаловать! Включи фоновую музыку, насладись атмосферой хвойного леса и скачай лаунчер для начала работы.</p>
            
            <!-- Ссылка на скачивание (замени "launcher.exe" на путь к своему файлу) -->
            <a href="launcher.exe" class="download-btn" download>Скачать лаунчер</a>
            
            <div style="margin-top: 15px;">
                <button class="music-control" id="music-toggle">
                    <span>🎵</span> <span id="music-text">Включить музыку</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicText = document.getElementById('music-text');
        
        music.volume = 0.4; // Установим комфортную тихую громкость

        musicToggle.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                musicText.textContent = 'Выключить музыку';
            } else {
                music.pause();
                musicText.textContent = 'Включить музыку';
            }
        });
    </script>
</body>
</html>
