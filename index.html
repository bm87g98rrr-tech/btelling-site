<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTelling Studio</title>
  <style>
    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: sans-serif;

  </div>

  <div class="card">
    <h3>Сценарии и Сюжеты</h3>
    <p>Проработка лора и сюжетных линий для SMP и YouTube.</p>
  </div>

  <div class="card">
